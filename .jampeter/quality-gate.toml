version = 1
profile = "ops-stack-manifest"

[report]
path = ".quality-gate/report.json"

[[gate]]
id = "manifest-json"
phase = "lint"
command = "python3 -m json.tool ops-stack.json >/dev/null"
required = true

[[gate]]
id = "manifest-contract"
phase = "test"
command = "python3 scripts/validate_manifest.py"
required = true

[[gate]]
id = "compile-validator"
phase = "type"
command = "python3 -m py_compile scripts/validate_manifest.py"
required = true
