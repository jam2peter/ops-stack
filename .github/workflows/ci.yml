name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest JSON
        run: python3 -m json.tool ops-stack.json >/dev/null

      - name: Validate required lifecycle phases
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("ops-stack.json", encoding="utf-8"))
          phases={p["id"]:p for p in d["phases"]}
          required={"provision","govern","schedule","preserve","deploy-control","deploy-engine","verify"}
          missing=required-set(phases)
          if missing:
              raise SystemExit("missing phases: "+",".join(sorted(missing)))
          if phases["schedule"]["repository"]!="jam2peter/github-agenda-sync":
              raise SystemExit("agenda sync integration missing")
          if phases["preserve"]["status"]!="private-candidate":
              raise SystemExit("preserve candidate state must be explicit")
          print("OPS_STACK_MANIFEST=PASS")
          PY

      - name: Sanitization scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.'             --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'             --exclude-dir=.git --exclude=ci.yml .
