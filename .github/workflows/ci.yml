name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JamPeter Quality Gate
        uses: jam2peter/quality-gate@v0
        with:
          config: .jampeter/quality-gate.toml

      - name: Validate manifest
        run: python3 scripts/validate_manifest.py

      - name: Sanitization scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.' --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' --exclude-dir=.git --exclude=ci.yml .
